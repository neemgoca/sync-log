name: sync

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"   # minutos desfasado: GitHub descarta más runs en :00; en la práctica ~cada 10-20 min
  workflow_dispatch:
    inputs:
      probar_push:
        description: "Mandar una notificación de prueba al celular"
        type: boolean
        default: false
      ventana_minutos:
        description: "Consultar cada 15 s durante estos minutos (para probar la ventana del viernes)"
        type: number
        default: 0

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # el viernes, el run que cae en la ventana se queda hasta las 14:20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # no el commit del disparo: un run en cola debe partir del state.json que dejó el anterior

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar
        env:
          API_BASE: ${{ secrets.API_BASE }}
          OBJETIVOS: ${{ secrets.OBJETIVOS }}
          ALERTAR_HUECOS: ${{ vars.ALERTAR_HUECOS || 'false' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROBAR_PUSH: ${{ inputs.probar_push || 'false' }}
          VENTANA_MINUTOS: ${{ inputs.ventana_minutos || 0 }}
        run: |
          python monitor.py
          # Los viernes la oficina abre citas hacia las 14:00 (hora de Madrid) y duran minutos: el run que cae
          # entre las 13:45 y las 14:20 se queda consultando cada 15 s hasta el final de esa franja.
          en_ventana() { h=$(TZ=Europe/Madrid date +%u%H%M); [ "$h" -ge 51345 ] && [ "$h" -lt 51420 ]; }
          fin=$(( $(date +%s) + VENTANA_MINUTOS * 60 ))
          while en_ventana || [ "$(date +%s)" -lt "$fin" ]; do
            sleep 15
            PROBAR_PUSH=false python monitor.py
          done

      - name: Abrir issue si hay aviso
        if: hashFiles('data/alerta.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Cambio detectado ($(TZ=Europe/Madrid date '+%d/%m %H:%M'))" --body-file data/alerta.md
          rm data/alerta.md

      - name: Guardar registro
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "check $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
